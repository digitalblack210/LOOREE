name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match version $version in pyproject.toml" }
      # Same install as CI: the CPU build of onnxruntime stands in for onnxruntime-gpu.
      - name: Test
        run: |
          python -m pip install numpy "onnx-asr[hub]>=0.12" "onnxruntime>=1.31" "PySide6-Essentials>=6.6" sounddevice pytest build
          python -m pip install --no-deps -e .
          python -m pytest
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusts this repository, workflow and environment, so no token is stored.
    environment:
      name: pypi
      url: https://pypi.org/project/looree/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
