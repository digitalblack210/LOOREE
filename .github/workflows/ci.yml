name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The tests never load a model, so the CPU build of onnxruntime stands in
      # for onnxruntime-gpu and its 1.6 GB of CUDA libraries.
      - name: Install
        run: |
          python -m pip install numpy "onnx-asr[hub]>=0.12" "onnxruntime>=1.31" "PySide6-Essentials>=6.6" sounddevice pytest ruff
          python -m pip install --no-deps -e .
      - run: python -m ruff check
      - run: python -m ruff format --check
      - run: python -m pytest
