[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turaco"
version = "0.1.0"
description = "Offline push-to-talk dictation for Windows, powered by NVIDIA Parakeet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "digitalblack210" }]
keywords = ["dictation", "speech-to-text", "push-to-talk", "parakeet", "offline", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy",
    "onnx-asr[hub]>=0.12",
    # Ships the CPU provider too, so this one wheel covers both devices.
    "onnxruntime-gpu[cuda,cudnn]>=1.31",
    "PySide6-Essentials>=6.6",
    "sounddevice",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/digitalblack210/TURACO"
Issues = "https://github.com/digitalblack210/TURACO/issues"

[project.gui-scripts]
# Starts without a console window.
turaco = "turaco.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
turaco = ["default_config.toml", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
